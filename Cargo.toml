[package]
name = "assistant"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "net"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libpulse-binding = "2"
libpulse-simple-binding = "2"
base64 = "0.22"
anyhow = "1"
toml = "0.8"
rust-stemmers = "1"
unicode-normalization = "0.1"
futures = "0.3"
