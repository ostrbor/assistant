name: ci

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: cargo build --release --features updater
      - run: cargo test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    # Built on the oldest supported Ubuntu so the binary runs on 22.04 and newer (glibc 2.35).
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check tag matches Cargo.toml version
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys;print(json.load(sys.stdin)["packages"][0]["version"])')
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != Cargo version v$v"; exit 1; }
      - run: cargo build --release --features updater
      - name: Package
        run: |
          name=assistant-$GITHUB_REF_NAME-x86_64-unknown-linux-gnu
          # Flat archive: self_update looks for the binary at the archive root.
          tar czf $name.tar.gz -C target/release assistant -C ../.. config.toml README.md
      - name: Build .deb (same binary as in the tar.gz, it updates itself)
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            assistant-*.tar.gz
            target/debian/*.deb
