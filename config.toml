# Root folder; each subfolder holds the PDFs for one call (pick it in the window)
docs_dir = "docs"

# How many seconds of recent speech to give the hint generator
hint_window_secs = 60

# After how many seconds a hint on screen is greyed out as old
hint_max_age_secs = 20

# Keep the hint up to date by itself: after every phrase of the other person the model sees the hint
# on screen and keeps, refines or replaces it (replaced hints stay below as earlier ones).
# Set to false to get hints only with the Hint button.
hint_auto = true

# How many of the best matching excerpts of your documents the hint generator gets
# (each is up to 200 words). More excerpts: fewer "not found" cases, a slower and costlier hint.
hint_chunks = 8

[transcribe]
# Transcription: OpenAI Realtime. Put your OpenAI API key here;
# if left empty, the environment variable named below is used instead
api_key = ""
api_key_env = "OPENAI_API_KEY"
model = "gpt-4o-transcribe"
language = "es"
# Frames quieter than this RMS level (16-bit samples) are treated as silence and not sent
# Tune both thresholds visually in the Audio window (bottom bar), then copy the values here
silence_threshold = 300
mic_silence_threshold = 500
# Also transcribe your own voice (default input device) so hints know what you already said
capture_mic = true
# Quiet time (ms) after which a phrase counts as finished: the other person / your microphone.
# Yours is longer so that an answer with pauses is not cut into pieces (each piece is transcribed worse).
silence_ms = 500
mic_silence_ms = 900
# Extra words for the recognizer (names, terms), e.g. "determinante, Cramer". The language and the
# chosen document folder are added by themselves and help it keep to Spanish.
prompt = ""

[llm]
# LLM for translation and hints: any OpenAI-compatible endpoint (HF router by default)
base_url = "https://router.huggingface.co/v1"
# Hugging Face token (or the key of the endpoint above); if empty, the environment variable below is used
api_key = ""
api_key_env = "HF_TOKEN"
translate_model = "openai/gpt-oss-20b:groq"
# Hints go to all listed models in parallel; the first to answer wins (hedging)
hint_models = ["openai/gpt-oss-120b:cerebras", "openai/gpt-oss-120b:groq"]

# Prices for the session cost report (cost.txt and the window after Stop). Built-in list prices are
# used for the models above; uncomment and edit to override them or to add another model.
# USD per 1M tokens; per_minute (USD per minute of audio) is only a fallback for transcription.
# [prices."openai/gpt-oss-120b:groq"]
# input = 0.15
# output = 0.75
# [prices."gpt-4o-transcribe"]
# input = 2.5
# output = 10.0
# per_minute = 0.006

[interview]
# Interviewer simulator (`--interview`), run on the machine that joins the call as the other person.
# Who the interviewer is (can be replaced with `--persona <file>`)
persona = "Eres Laura, engineering manager en una empresa de software. Entrevistas a un candidato para un puesto de desarrollador. Tono amable y profesional."
# Questions after the greeting
questions = 5
# Text-to-speech (OpenAI, same key as transcription)
tts_model = "gpt-4o-mini-tts"
voice = "coral"
tts_instructions = "Habla en español, con tono amable y profesional y un ritmo natural."
# Quiet time after which an answer counts as finished
answer_silence_secs = 3.0
